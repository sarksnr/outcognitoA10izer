<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 140px;
      padding: 12px;
      margin: 0;
      font-family: sans-serif;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s ease;
    }
    .btn-on {
      background-color: #22c55e;
    }
    .btn-off {
      background-color: #ef4444;
    }
  </style>
</head>
<body>
  <button id="toggleBtn" class="btn-on">Turn OFF</button>

  <script src="popup.js"></script>
</body>
</html>
